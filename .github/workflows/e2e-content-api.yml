name: E2E - Content API to Amplify

on:
  push:
    branches: [dev]
    paths: ['.github/run-e2e']

permissions:
  contents: write

jobs:
  e2e:
    runs-on: ubuntu-latest
    env:
      AWS_REGION: ${{ vars.AWS_REGION }}
      AMPLIFY_APP_ID: ${{ vars.AMPLIFY_APP_ID }}
      AMPLIFY_BRANCH: dev
    steps:
      - name: Checkout dev
        uses: actions/checkout@v4
        with:
          ref: dev
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Generate ephemeral API key
        id: genkey
        run: |
          KEY="zgo_$(openssl rand -hex 24)"
          HASH=$(printf '%s' "$KEY" | openssl dgst -sha256 | awk '{print $2}')
          echo "::add-mask::$KEY"
          echo "key=$KEY" >> "$GITHUB_OUTPUT"
          echo "hash=$HASH" >> "$GITHUB_OUTPUT"
          echo "Key generated OK"

      - name: Report success
        run: echo "Steps OK. Key prefix = ${{ steps.genkey.outputs.hash }}"
