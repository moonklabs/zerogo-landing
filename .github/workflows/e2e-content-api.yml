name: E2E - Content API to Amplify

on:
  workflow_dispatch:

permissions:
  contents: write
  actions: write

env:
  AWS_REGION: ${{ vars.AWS_REGION }}
  AMPLIFY_APP_ID: ${{ vars.AMPLIFY_APP_ID }}
  AMPLIFY_BRANCH: dev

jobs:
  e2e:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout dev
        uses: actions/checkout@v5
        with:
          ref: dev
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Install dependencies
        run: npm ci

      # Generate ephemeral API key (used only within this run)
      - name: Generate ephemeral API key
        id: genkey
        run: |
          OUTPUT=$(npx tsx scripts/gen-key.ts e2e-run)
          KEY=$(echo "$OUTPUT" | grep -A1 "평문 키" | tail -1 | xargs)
          HASH=$(echo "$OUTPUT" | grep -A1 "SHA-256 해시" | tail -1 | xargs)
          echo "::add-mask::$KEY"
          echo "key=$KEY" >> "$GITHUB_OUTPUT"
          echo "hash=$HASH" >> "$GITHUB_OUTPUT"
          echo "Key generated (masked)"

      - name: Set API_KEYS_JSON on worker
        working-directory: ./cloudflare-workers/content-api
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          KEY_HASH: ${{ steps.genkey.outputs.hash }}
        run: |
          npm ci
          printf '%s' "[\"$KEY_HASH\"]" \
            | npx wrangler@3 secret put API_KEYS_JSON --name zerogo-content-api

      - name: Set GITHUB_TOKEN on worker
        working-directory: ./cloudflare-workers/content-api
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          GH_TOKEN_FOR_WORKER: ${{ secrets.GITHUB_TOKEN }}
        run: |
          printf '%s' "$GH_TOKEN_FOR_WORKER" \
            | npx wrangler@3 secret put GITHUB_TOKEN --name zerogo-content-api

      - name: Create blog post via Content API
        id: create_post
        env:
          API_KEY: ${{ steps.genkey.outputs.key }}
        run: |
          RESPONSE=$(curl -s -w "\n%{http_code}" -X POST \
            "https://zerogo-content-api.sellerking.workers.dev/api/posts" \
            -H "Authorization: Bearer $API_KEY" \
            -H "Content-Type: application/json" \
            -d '{
              "title": "API 발행 E2E 테스트",
              "description": "Content API를 통한 자동 발행 검증",
              "body": "# API 발행 E2E 테스트\n\n이 포스트는 Content API E2E 검증을 위해 자동 생성됐습니다.\n\n**검증 흐름:** Worker API → GitHub dev 커밋 → Amplify 재빌드 → dev.zerogo.ai/blog 노출"
            }')
          HTTP_CODE=$(echo "$RESPONSE" | tail -1)
          BODY=$(echo "$RESPONSE" | head -1)
          echo "HTTP Status: $HTTP_CODE"
          if [ "$HTTP_CODE" != "201" ]; then
            echo "ERROR: Expected 201, got $HTTP_CODE — $BODY"
            exit 1
          fi
          SLUG=$(echo "$BODY" | python3 -c "import json,sys; print(json.load(sys.stdin)['slug'])")
          echo "Created slug: $SLUG"
          echo "slug=$SLUG" >> "$GITHUB_OUTPUT"

      - name: Pull new commit and build
        run: |
          git pull origin dev
          echo "content/blog/ files:"
          ls content/blog/ | tail -5
          npm run build
          npm run postbuild
          test -f dist/api/posts/index.json
          echo "Posts in build:"
          python3 -c "import json; [print(p['slug']) for p in json.load(open('dist/api/posts/index.json'))]"
          cd dist && zip -r ../site.zip .

      - name: Deploy to Amplify
        id: deploy
        run: |
          DEPLOYMENT_JSON=$(aws amplify create-deployment \
            --app-id "$AMPLIFY_APP_ID" --branch-name "$AMPLIFY_BRANCH")
          JOB_ID=$(python3 -c 'import json,sys; print(json.load(sys.stdin)["jobId"])' <<< "$DEPLOYMENT_JSON")
          ZIP_URL=$(python3 -c 'import json,sys; print(json.load(sys.stdin)["zipUploadUrl"])' <<< "$DEPLOYMENT_JSON")
          curl --fail -s -H 'Content-Type: application/zip' --upload-file site.zip "$ZIP_URL"
          aws amplify start-deployment --app-id "$AMPLIFY_APP_ID" \
            --branch-name "$AMPLIFY_BRANCH" --job-id "$JOB_ID" >/dev/null
          echo "job_id=$JOB_ID" >> "$GITHUB_OUTPUT"

      - name: Wait for Amplify
        run: |
          JOB_ID="${{ steps.deploy.outputs.job_id }}"
          for i in $(seq 1 60); do
            STATUS=$(aws amplify get-job --app-id "$AMPLIFY_APP_ID" \
              --branch-name "$AMPLIFY_BRANCH" --job-id "$JOB_ID" \
              --query 'job.summary.status' --output text)
            echo "[$i/60] $STATUS"
            case "$STATUS" in SUCCEED) exit 0 ;; FAILED|CANCELLED) exit 1 ;; esac
            sleep 10
          done
          exit 1

      - name: Verify at dev.zerogo.ai/blog
        run: |
          SLUG="${{ steps.create_post.outputs.slug }}"
          POSTS=$(curl -s "https://dev.zerogo.ai/api/posts/index.json")
          echo "Posts on dev.zerogo.ai:"
          echo "$POSTS" | python3 -c "import json,sys; [print(p['slug']) for p in json.load(sys.stdin)]" || true
          if echo "$POSTS" | python3 -c "
import json, sys
posts = json.load(sys.stdin)
slugs = [p['slug'] for p in posts]
slug = '$SLUG'
if slug in slugs:
    print(f'SUCCESS: {slug} is live at https://dev.zerogo.ai/blog')
else:
    print(f'FAILED: {slug} not found. Available: {slugs}')
    exit(1)
"; then
            echo "E2E test passed!"
          else
            exit 1
          fi
