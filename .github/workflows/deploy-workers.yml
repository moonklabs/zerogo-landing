name: Deploy Cloudflare Workers

# The Next.js app itself is built & deployed by AWS Amplify (WEB_COMPUTE) on
# every push to a connected branch — no GitHub Actions needed for hosting.
# This workflow only keeps the supporting Cloudflare Workers up to date:
#   - apply-api    : superseded by the Next.js /api/apply route, kept for compat
#   - decap-oauth  : GitHub OAuth proxy for Decap CMS on dev.zerogo.ai
# (content-api was removed in the Next.js migration — SSR reads markdown directly.)

on:
  push:
    branches: [dev, main]
    paths:
      - "cloudflare-workers/apply-api/**"
      - "cloudflare-workers/decap-oauth/**"
      - ".github/workflows/deploy-workers.yml"
  workflow_dispatch:

concurrency:
  group: deploy-workers-${{ github.ref_name }}
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    strategy:
      matrix:
        worker: [apply-api, decap-oauth]
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Deploy ${{ matrix.worker }}
        working-directory: ./cloudflare-workers/${{ matrix.worker }}
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          npm ci
          npx wrangler deploy
