name = "zerogo-content-api"
main = "src/index.ts"
compatibility_date = "2024-04-12"
workers_dev = true

[vars]
GITHUB_OWNER = "moonklabs"
GITHUB_REPO = "zerogo-landing"
GITHUB_BRANCH = "dev"

# Secrets — set once via wrangler CLI, persisted in Cloudflare:
#   wrangler secret put GITHUB_TOKEN     # GitHub PAT with repo scope
#   wrangler secret put API_KEYS_JSON    # JSON array of SHA-256 key hashes
#                                         # e.g. ["abc123...", "def456..."]
#
# Key generation: npx tsx ../../scripts/gen-key.ts <name>
#
# Local dev — create .dev.vars (gitignored) with the same keys:
#   GITHUB_TOKEN="ghp_..."
#   API_KEYS_JSON='["<hash>"]'

# Optional: custom domain route
# [[routes]]
# pattern = "api.zerogo.ai/api/*"
# zone_name = "zerogo.ai"
