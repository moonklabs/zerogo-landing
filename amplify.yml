version: 1
frontend:
  phases:
    preBuild:
      commands:
        - npm ci
    build:
      commands:
        - printf "LANDING_CONFIG_API_BASE=%s\n" "$LANDING_CONFIG_API_BASE" > .env.production
        - printf "LANDING_REVALIDATE_SECRET=%s\n" "$LANDING_REVALIDATE_SECRET" >> .env.production
        - printf "NEXT_PUBLIC_GTM_ID=%s\n" "$NEXT_PUBLIC_GTM_ID" >> .env.production
        - printf "LANDING_PREVIEW_ALLOWED_ORIGINS=%s\n" "$LANDING_PREVIEW_ALLOWED_ORIGINS" >> .env.production
        - printf "NEXT_PUBLIC_LANDING_MEDIA_GCS_PUBLIC_BASE=%s\n" "$NEXT_PUBLIC_LANDING_MEDIA_GCS_PUBLIC_BASE" >> .env.production
        - npm run build
  artifacts:
    # Next.js SSR (WEB_COMPUTE) build output.
    baseDirectory: .next
    files:
      - '**/*'
  cache:
    paths:
      - .next/cache/**/*
      - node_modules/**/*
